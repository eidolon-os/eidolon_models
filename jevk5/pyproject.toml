[project]
name = "eidolon-models-jevk5"
version = "0.1.0"
description = "Independent JevK5 participation decision experiments and runtime"
requires-python = ">=3.13,<3.14"
dependencies = [
  "torch==2.14.0", "transformers==5.17.0", "accelerate==1.15.0",
  "huggingface-hub==1.32.0", "numpy==2.5.3", "safetensors==0.8.0",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[project.scripts]
eidolon-jevk5 = "eidolon_models_jevk5.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eidolon_models_jevk5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

