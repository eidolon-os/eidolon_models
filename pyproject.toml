[project]
name = "eidolon-models-asr"
version = "0.1.0"
description = "Host-independent local ASR service for Eidolon OS"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "aiohttp>=3.11,<4",
  "funasr-onnx==0.4.2",
]

[project.scripts]
eidolon-asr = "eidolon_models_asr.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-aiohttp>=1.1,<2",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eidolon_models_asr"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "model: loads the real ONNX model and performs inference",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
