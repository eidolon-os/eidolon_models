# How eidolon_models is operated, stated by the component that owns it.
#
# This component is different from the other eight in one way that shapes the
# whole file: not every Host runs it. A board with an NPU listens and speaks
# with its own models; a Host without one reaches a provider for the same two
# things and should carry none of this. So every unit here states the Host
# capability it needs, and a Host that does not provide it installs nothing
# from this component — no unit, no port reserved, no weights carried.

schema_version = 1
component_id = "eidolon_models"
contract_version = "1"

[[units]]
id = "eidolon-asr"
kind = "service"
exec = "scripts/eidolon-asr"
user = "eidolon"
serves = ["asr_stream"]
after = ["local-fs.target", "network.target"]
# Speech recognition on this Host rather than at a provider. Without it the
# unit is not installed and Channel's stt_provider stays pointed outward.
requires_capability = "local_asr"

[ports.asr_stream]
default = 8768
bind = "loopback"
purpose = "funasr 2pass streaming recognition, WebSocket at /v1/stream"

[[units]]
id = "eidolon-llm"
kind = "service"
exec = "scripts/eidolon-llm"
user = "eidolon"
serves = ["llm_api"]
after = ["local-fs.target", "network.target"]
# The conversation runs on this Host instead of at a provider. Without it the
# unit is not installed and whoever asks the model a question keeps asking one
# outside.
#
# Nothing in Eidolon speaks a protocol of ours to it: `llama-server` serves the
# OpenAI shape, and the Agent already reaches its model through LiteLLM with a
# name and an `api_base`. So making this Host answer its own questions is an
# address, not an adapter — which is why this component ships a launcher and no
# client.
requires_capability = "local_llm"

[ports.llm_api]
default = 8769
bind = "loopback"
purpose = "chat completions, OpenAI-compatible HTTP at /v1"

[[units]]
id = "eidolon-tts"
kind = "service"
exec = "scripts/eidolon-tts"
user = "eidolon"
serves = ["tts_stream"]
after = ["local-fs.target", "network.target"]
# This Host speaks with its own voice instead of a provider's. Without it the
# unit is not installed and Channel's tts_provider stays pointed outward.
#
# Unlike the LLM beside it, this one ships an engine as well as a launcher:
# `llama-server` is upstream's own server, while CosyVoice2's streaming
# pipeline is ours and links this board's NPU runtime — so its source rides
# the release and the unit builds it here before starting. See
# src/eidolon_models_tts/cpp/README.md.
requires_capability = "local_tts"

[ports.tts_stream]
default = 8770
bind = "loopback"
purpose = "CosyVoice2 streaming synthesis, WebSocket at /v1/stream"

[[artifacts]]
id = "qwen3-1.7b-q4_0"
kind = "model"
install_root = "/var/lib/eidolon/models/qwen3-1.7b"
requires_capability = "local_llm"
# Declared here because a release is exact Git commits and a gigabyte of
# weights is in neither. Without this the unit above starts, finds no model,
# and exits — which is at least loud, unlike the alternative of fetching from a
# model hub on first use on a Host that may have no route to one.
#
# Q4_0 rather than a K-quant, and measured rather than assumed: on this board
# Q4_0 decodes at 5.83-5.88 tok/s against Q4_K_M's 4.59-4.62, because Q4_0 has
# the ARM dotprod kernels this SoC can use (asimddp, no i8mm). The threshold is
# 3.43 tok/s — what it takes for the model to keep ahead of speech being spoken
# — so the K-quant's margin is 1.34x against Q4_0's 1.7x, and
# HOST-RK3588.md §2.24-2.25 already spends most of what is there.
#
# The upstream digest below is byte-identical to the file §2.23 was measured
# against, so the number above and the artifact carried here are one thing.

[[artifacts.files]]
path = "Qwen3-1.7B-Q4_0.gguf"
sha256 = "c876f159707a4e4f70e045106c69db15bfc935a4981706fd4f65c6e7ea1e81c5"
# unsloth's rather than ggml-org's, and not a matter of taste: ggml-org
# publishes Q4_K_M for this model and no Q4_0. This digest is byte-identical to
# the file the numbers above were measured on.
# The revision is a commit and not `main`, for the same reason every other
# pinned artifact names something immutable: a branch can be moved under a
# digest, and then the pin fails rather than the file being wrong. Checked
# against the hub's own LFS metadata at this commit: 1056782912 bytes hashing
# to the digest above.
url = "https://huggingface.co/unsloth/Qwen3-1.7B-GGUF/resolve/d7f544eead698dbd1f15126ef60b45a1e1933222/Qwen3-1.7B-Q4_0.gguf"

# CosyVoice2 的合成权重不在这里，是**有意**的，理由和 ASR 一样：它们提交进了
# 仓库（tts/cosyvoice2-rk3588/<版本>/，Git LFS）。发布归档仅在 Host 选择
# local_tts 时包含 tts/，否则不把这些字节传上板。
#
# 这里曾经**同时**声明过一份上游 pin，装到 .../cosyvoice2-upstream，用意是"同样
# 的字节可以不经 Git 再取一次、再核一次"。拆掉了：
#
# * 那个 pin 当初必须用一个不可服务的路径，理由是包里有两个上游不发布的
#   manifest.json，所以声明"永远凑不成一个完整的模型根"。那两个文件引擎根本不读，
#   已经去掉了，所以那个理由不在了。
# * 而它证明的事——仓库那份等于上游——已经由 tests/test_tts_model_package.py 逐字节
#   核过。再在主机上放一份 1.5 GB 只是同一件事的第二个副本。
#
# 出处**没有**因此变弱：包自己的 manifest.json 记着上游仓库、不可变 revision、以及
# 每个文件在上游的路径，三者能拼出可解析的 URL，并且有测试钉住这一点。
#

# Other local-model artifacts are declared only when their bytes and origin
# can be pinned. Laya r14 below uses the local frozen-source transport.
#
# The ASR weights are not artifacts: they are committed to this repository
# (asr/*/2.0.5/, ~728 MB, each version carrying a manifest.json with a SHA-256
# per file). The release archive includes asr/ only for local_asr Hosts;
# exact Git commits pin those bytes. The `artifacts` section exists for what
# Git does not hold.
#
# CosyVoice2's RKNN and RKLLM models used to be listed here as undeclarable,
# on the grounds that conversion outputs are not pinned anywhere. They are:
# Sariel00/cosyvoice2_rknn publishes them with a MANIFEST.sha256, and they are
# declared above and committed under tts/. What is left of that case is the
# Qwen3-1.7B RKNN conversion at 2.3 GB, which is a local conversion with no
# published counterpart — declaring it without a digest anything could check
# would be a promise the release cannot keep. It arrives with
# `requires_capability = "rknpu2"` when it is pinned, alongside the unit that
# loads it.
#
# The NPU runtime libraries belong with those models rather than with the
# foundation: librknnrt.so and librkllmrt.so are loaded only by the components
# that run models, a Host without the rknpu2 capability has no use for either,
# and the CosyVoice2 engine already carries its own copy today. So they are
# left undeclared here for the same reason the models are — declaring the
# library without the models it serves would be arbitrary.
#
# What has been established, so whoever declares them does not repeat it:
# librknnrt.so 2.3.2 (build 429f97ae6b@2025-04-09) is
#   https://raw.githubusercontent.com/airockchip/rknn-toolkit2/42aa1d426c0a9e0869b6374edba009f7208a1926/rknpu2/runtime/Linux/librknn_api/aarch64/librknnrt.so
#   sha256 d31fc19c85b85f6091b2bd0f6af9d962d5264a4e410bfb536402ec92bac738e8
# fetched and compared byte for byte against the copy running on the board.
# The commit is the tag v2.3.2 resolved to an immutable ref, because a tag can
# be moved and every other pinned artifact names something that cannot be.
#
# Declaring an artifact is now the whole of the work: `artifacts` says which
# files must be present, what they hash to, and where the bytes come from, and
# eidolon_ops/component_artifacts.py carries whatever any component declares.
# The files are fetched on the workstation and carried over the transport a
# release already uses — never pulled by the Host, which is the case above
# about a board with no route to a model hub.

[[units]]
id = "eidolon-laya"
kind = "service"
exec = "scripts/eidolon-laya"
user = "eidolon"
serves = ["laya_api"]
after = ["local-fs.target", "network.target"]
requires_capability = "local_laya"

[ports.laya_api]
default = 8771
bind = "loopback"
purpose = "Laya System One decision suggestions, HTTP at /v1/systemone"

# c10 (e8254243), RK3588 FP16; fixed-weight parity and policy validation:
