# The companion / role-team participation model is a service of its own, not a second route on the one
# above: its own unit, port, capability and pinned weights, and its own table in laya/deploy/services.toml
# (NPU core 0; the smart-home service holds 1 and 2, so neither queues behind the other). A Host that runs
# one need not run the other, and either can be updated or rolled back alone.
[[units]]
id = "eidolon-laya-participation"
kind = "service"
exec = "scripts/eidolon-laya-participation"
user = "eidolon"
serves = ["laya_participation_api"]
after = ["local-fs.target", "network.target"]
requires_capability = "local_laya_participation"

[ports.laya_participation_api]
default = 8773
bind = "loopback"
purpose = "Laya participation decisions (companion / role team), HTTP at /v1/participation/decide"

