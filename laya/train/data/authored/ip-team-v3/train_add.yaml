    - {action: clarify, speaker: b, brief: "公开历史没有具体书名，问用户指哪本书"}
- id: v3_clarify_unknown_member
  mode: named
  tag: clarify
  cast: {a: "擅长写作", b: "擅长运动", c: "擅长主持澄清"}
  user: "请小刚接着说。"
