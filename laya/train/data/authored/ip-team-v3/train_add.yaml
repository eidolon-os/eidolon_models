- id: v3_public_prior_long
  history_stress: "家庭相册整理"
  mode: interrupt
  tag: long_context
  cast: {a: "擅长讲园艺", b: "擅长安排修理", c: "负责主持", d: "擅长安静陪伴"}
  prelude:
    - {author: user, text: "我们原本想把阳台改成小花园，请分几步讨论。"}
    - {author: a, text: "先看光照时长，再挑容易养的植物。上午阳光短，薄荷和迷迭香不能随便混种。"}
    - {author: b, text: "木架承重也要算进去，花盆装满湿土后比想象中重，最好先确认阳台的安全边界。"}
    - {author: c, text: "我们先处理安全和位置，再谈买哪种花，不用一下子把所有选择做完。"}
    - {author: a, text: "如果日照不足，就从耐阴绿植开始，每周检查叶片和土壤变化。"}
    - {author: b, text: "浇水要留排水空间，别让水沿窗台流到楼下，也别挡住消防通道。"}
    - {author: c, text: "这些条件合在一起：先量尺寸和光照，确认承重、排水，再买少量植物试养。"}
  user: "等一下，先别说花园了。我想知道那个松动的窗扣明天怎么找人修。"
  steps:
    - {action: respond, speaker: b, brief: "按新窗扣问题回应，旧花园计划不续接"}
