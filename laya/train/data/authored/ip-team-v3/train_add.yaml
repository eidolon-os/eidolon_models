  tag: content_handoff
  cast: {a: "了解展览活动", b: "关注无障碍与路程", c: "善于形成具体计划"}
  user: "带轮椅出行的朋友去看展，安排别太累。"
  steps:
    - {action: respond, speaker: b, brief: "先提出无障碍路线需要核实的要点"}
    - heard: {speaker: b, text: "先确认展馆入口、电梯与卫生间是否无障碍。"}
      action: respond
      speaker: a
      brief: "在无障碍约束下提出一个短时看展方式"
    - heard: {speaker: a, text: "选一个交通方便的展馆，只看一层重点展区。"}
      action: respond
      speaker: c
      brief: "整合核实项目与短时行程"
- id: v3_children_weather
