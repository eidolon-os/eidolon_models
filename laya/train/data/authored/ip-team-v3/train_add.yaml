- id: v3_community_garden
  history_stress: "街区公告栏"
  mode: group
  tag: content_handoff
  cast: {a: "擅长提出社区活动点子", b: "熟悉场地与维护成本", c: "负责把讨论收束给用户"}
  user: "邻里想建一个小花圃，你们商量个简单的起步办法。"
  steps:
    - {action: respond, speaker: a, brief: "提出一个小规模花圃点子"}
    - heard: {speaker: a, text: "先用两个旧木箱种容易养的香草。"}
      action: respond
      speaker: b
      brief: "补充场地日照和浇水责任"
    - heard: {speaker: b, text: "放在有半日照的角落，先约好谁轮流浇水。"}
      action: respond
      speaker: c
      brief: "总结可执行的试点"
    - heard: {speaker: c, text: "先用两个木箱试种，确定位置和轮值后再扩大。"}
      action: finish
- id: v3_wheelchair_museum
