  tag: wait
  cast: {a: "善于共情", b: "善于分析问题"}
  user: "我今天情绪不太好，只要一句陪伴，然后安静一会儿。"
  steps:
    - {action: respond, speaker: a, brief: "简短陪伴"}
    - heard: {speaker: a, text: "我陪着你，想说话时再叫我。"}
      action: wait
- id: v3_finish_explicit_thanks
  mode: group
  tag: finish
  cast: {a: "会给建议", b: "善于总结"}
  user: "谢谢，刚才的事情解决了，这轮就到这里。"
  steps:
    - {action: finish}
- id: v3_finish_named_answer
  mode: named
  tag: finish
  cast: {a: "懂图书分类", b: "喜欢继续举例"}
  user: "{a}只回答一次‘科幻小说’是什么，回答后结束。"
  steps:
    - {action: respond, speaker: a, brief: "简要解释科幻小说"}
    - heard: {speaker: a, text: "科幻小说以科学想象为线索，写可能的世界或技术。"}
      action: finish
- id: v3_finish_enough_detail
  mode: discuss
  tag: finish
  cast: {a: "善于提出点子", b: "善于指出限制", c: "善于归纳"}
  user: "我们只要一条可行的早起办法，不用展开讨论。"
  steps:
    - {action: respond, speaker: c, brief: "一次给出可行建议"}
    - heard: {speaker: c, text: "今晚把闹钟放远一点，并把明早要穿的衣服备好。"}
      action: finish
- id: v3_finish_round_done
  mode: discuss
  tag: finish
  cast: {a: "热心发言", b: "善于收尾"}
  user: "两种看法我都听到了，可以结束本轮讨论。"
  steps:
    - {action: finish}
- id: v3_clarify_which_book
