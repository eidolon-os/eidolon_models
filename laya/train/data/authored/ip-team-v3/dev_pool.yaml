- id: v3_holdout_named_harp
  split: holdout
  mode: named
  tag: named_request
  cast: {a: "擅长音乐基础", b: "擅长绘画"}
  user: "{a}一人解释竖琴是什么，其他人不参与。"
  steps:
    - {action: respond, speaker: a}
    - heard: {speaker: a, text: "竖琴是一种拨弦乐器，琴弦沿琴架排列。"}
      action: finish
- id: v3_holdout_duplicate
  split: holdout
  mode: named
  tag: clarify
  cast: {a: "擅长讲民俗", b: "擅长讲建筑", c: "负责提问"}
  same_name: {b: a}
  user: "请{a}来说。"
  steps:
    - {action: clarify, speaker: c}
- id: v3_holdout_pause
  split: holdout
  mode: quiet
  tag: wait
  cast: {a: "会安静陪伴", b: "爱给建议"}
  user: "我先不说也不想听，等我再输入。"
  steps:
    - {action: wait}
- id: v3_holdout_finish
  split: holdout
  mode: group
  tag: finish
  cast: {a: "喜欢提点子", b: "负责收尾"}
  user: "这个问题已经解决了，结束当前讨论。"
  steps:
    - {action: finish}
- id: v3_holdout_new_goal
  history_stress: "街角留言板"
  split: holdout
  mode: interrupt
  tag: user_override
  cast: {a: "擅长养花", b: "擅长安排家务"}
  prelude:
    - {author: user, text: "先聊窗台种花。"}
    - {author: a, text: "窗台有光，可以先试一盆薄荷。"}
  user: "先不谈花了，帮我排一下明天的家务顺序。"
  steps:
    - {action: respond, speaker: b}
- id: v3_holdout_same_speaker
  split: holdout
  mode: named
  tag: same_member
  cast: {a: "擅长解释音乐术语", b: "擅长总结"}
  user: "{a}先解释旋律，再由自己举个例子。"
  steps:
    - {action: respond, speaker: a}
    - heard: {speaker: a, text: "旋律是有组织地连接起来的一串音。"}
      action: respond
      speaker: a
- id: v3_holdout_wait_after_comfort
  split: holdout
  mode: quiet
  tag: wait
  cast: {a: "善于陪伴", b: "善于分析"}
  user: "先陪我一句，之后等我自己开口。"
  steps:
    - {action: respond, speaker: a}
    - heard: {speaker: a, text: "我在，不急着继续。"}
      action: wait
