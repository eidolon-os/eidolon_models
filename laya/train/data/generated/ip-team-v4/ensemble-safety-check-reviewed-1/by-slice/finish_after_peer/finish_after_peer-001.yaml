- mode: named
  cast:
    a: 慢性子，爱先观察再开口，说话绕弯，总被{c}催
    b: 话少，喜欢举例子讲道理，和{a}互相看不惯又处得来
    c: 嗓门大坐不住，想一出是一出，常拉{a}和{b}陪自己疯
  user: '{a}你先别打岔，一次把话说完整：退潮后礁石那边到底值不值得走一趟，把理由讲全，答完本轮就结束，别拖到明天再说。'
  prelude: []
  steps:
  - action: respond
    speaker: a
    brief: 用户明确先让 a 完成回答
  - action: finish
    heard:
      speaker: a
      text: 值得，但只能走半小时。退潮后礁石缝里有小螃蟹和寄居蟹，孩子气的人会挪不动步；可潮水回涨比想的快，看到水开始漫过脚边那块扁石头就得折返，别贪。
    brief: a 已完成回答，按用户要求结束
  tag: finish_after_peer
