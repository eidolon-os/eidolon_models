      text: 建议用三幕倒叙：第一幕只呈现现代相遇的三个冲突点，第二幕用一个信物把前世身份逐个揭晓，第三幕回到现在完成闭环。时间线全部锚定在信物出现的三个节点上，观众跟着物件走就不会乱，其他细节后续再补。
