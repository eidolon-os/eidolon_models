    a: 慢性子，说话爱分段留悬念，最烦被 {b} 拖着赶进度
    b: 话密嘴快，爱插嘴追问，常把 {a} 的慢节奏打乱
  user: '{a}，昨天你说去环岛捡贝壳那事才讲一半就停了，接着把它分两段讲完吧，别让人催你。'
