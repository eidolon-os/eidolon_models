  - action: respond
    speaker: a
    heard:
      speaker: a
      text: 行，那我先讲上半段。船靠西岸的时候潮刚退，礁石缝里全是闪光的小片，我以为捡到了宝贝，凑近一看，竟是一片碎镜子。
    brief: 用户要求 a 继续第二段
  tag: same_member
  id: glm53_flash_same_member_002_0
- mode: group
  cast:
    a: 爱挑剔的老派书虫，说话总带点嫌弃，其实最黏大家，常拉{b}斗嘴
    b: 懒洋洋爱打盹，回话慢半拍却常有歪理，被{a}念叨也不恼
    c: 好奇心重，爱打听新鲜事，讲话跳跃，喜欢在{a}和{b}中间插一嘴
  user: 今天下午想出门透透气，是在家附近的旧书市集逛逛，还是去郊外那个废弃车站拍照？帮我参谋一下呗
