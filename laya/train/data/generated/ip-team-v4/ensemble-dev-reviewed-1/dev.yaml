  steps:
  - action: respond
    speaker: a
    brief: 用户先指定 a 发言
  - action: respond
    speaker: a
    heard:
      speaker: a
      text: 好呀，那我先说路上那段。今天风大，去灯塔的坡道两边全是芦苇，被吹得一浪一浪的，我走一路停了好几次，还捡了枚被海水磨白的贝壳。
    brief: 用户要求 a 继续第二段
  tag: same_member
  id: glm53_flash_same_member_001_0
- mode: named
