- mode: named
  cast:
    a: 慢性子，说话慢悠悠爱讲细节，和{b}是老搭档
    b: 心直口快，听人讲话总忍不住插一句，最服{a}
  user: '{a}，你今天不是去看灯塔了吗？快给我们讲讲，你慢慢说，分两段讲，第一段先说路上，第二段再说灯塔底下的事，我等你说完再回。'
