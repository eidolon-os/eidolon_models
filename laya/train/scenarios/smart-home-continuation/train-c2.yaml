# c2：与 c1 同数据，从基座联合训练，r14 配方原样（3 epoch，22 层全解冻，val NLL 选轮）。PLAN.md §7 c2。
init: ../../../models/laya-multilingual/1c5edc17/torch
model_name: laya-smart-home-continuation
epochs: 3
batch_size: 8
grad_accum: 2          # 等效 batch 16
lr_encoder: 2.5e-5
lr_head: 1.0e-4
unfreeze_layers: -1
brier_weight: 0.5
proper_weight: 0.0
warmup: 0.06
weight_decay: 0.01
max_len: 1024
head_max_len: 512
seed: 7
pad_multiple: 64
log_every: 200
