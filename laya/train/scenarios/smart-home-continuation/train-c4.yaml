# c4：配方与 c1 / c3 完全相同（改动只在数据，见 assemble-c4.yaml）。
init: ../../../models/laya-smart-home/45f3dedb/torch
model_name: laya-smart-home-continuation
epochs: 2
batch_size: 8
grad_accum: 2          # 等效 batch 16；全解冻在本机 MPS 上用 8 × 2（participation 同配置）
lr_encoder: 2.5e-5
lr_head: 1.0e-4
unfreeze_layers: -1
brier_weight: 0.5
proper_weight: 0.0
warmup: 0.06
weight_decay: 0.01
max_len: 1024
head_max_len: 512
seed: 7
pad_multiple: 64
log_every: 200
