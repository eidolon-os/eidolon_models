# 配方实验：相对 train.yaml 只改一处——训练 5 个 epoch。
init: ../../../models/laya-multilingual/1c5edc17/torch
model_name: laya-smart-home
epochs: 5   # 固定配方是 3；仍按验证集 NLL 选最好的一轮
batch_size: 16
lr_encoder: 2.5e-5
lr_head: 1.0e-4
unfreeze_layers: 8
brier_weight: 0.5
proper_weight: 0.0
warmup: 0.06
weight_decay: 0.01
max_len: 1024
head_max_len: 512
seed: 7
