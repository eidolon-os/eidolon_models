# 参与决策 p2：p1 配方，唯一改动是按验证准确率选轮（见 EXPERIMENTS.md p2）；batch 8 × 累积 2 只为省内存，等效 batch 不变。
init: ../../../models/laya-multilingual/1c5edc17/torch
model_name: laya-participation
epochs: 3
batch_size: 8
grad_accum: 2
lr_encoder: 2.5e-5
lr_head: 1.0e-4
unfreeze_layers: -1
brier_weight: 0.5
proper_weight: 0.0
warmup: 0.06
weight_decay: 0.01
max_len: 1024        # 实测最长约 720 token（团队 5 人 + 16 条历史）
head_max_len: 512
seed: 7
pad_multiple: 64      # MPS 按形状编译并缓存图；精确长度 × 1,200 个 batch 把内存涨到 32 GB 开始换页（p1 首跑）
log_every: 200
checkpoint_metric: accuracy
