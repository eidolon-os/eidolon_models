# laya decision API behind the host nginx. Installed by deploy/ecs/deploy.sh as
# /etc/nginx/conf.d/__SERVER_NAME__.conf with the placeholders filled in.
# The service itself listens on 127.0.0.1 only; the bearer key is still required.

upstream eidolon_laya {
    server 127.0.0.1:__PORT__;
    keepalive 8;
}

server {
    listen 80;
    # listen [::]:80;  # disabled: PVM kernel has no IPv6
    server_name __SERVER_NAME__;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # listen [::]:443 ssl;  # disabled: PVM kernel has no IPv6
    http2 on;
    server_name __SERVER_NAME__;

    ssl_certificate     __SSL_DIR__/fullchain.pem;
    ssl_certificate_key __SSL_DIR__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=63072000" always;

    access_log /var/log/nginx/eidolon-laya-access.log;
    error_log  /var/log/nginx/eidolon-laya-error.log;

    # Same ceiling as the service's EIDOLON_LAYA_MAX_BODY_BYTES (256 KiB).
    client_max_body_size 256k;

    location / {
        proxy_pass http://eidolon_laya;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A decision is ~1-2 s on this host; a request raised to 2K+ tokens can take 15 s.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
