[project]
name = "eidolon-models-laya"
version = "0.1.0"
description = "laya typed-decision model as an HTTP service, with PyTorch and ONNX Runtime backends"
readme = "README.md"
requires-python = ">=3.13,<3.14"
# Everything the service needs whichever backend it runs: the torch-free
# sequence builder, the HTTP surface, and the fetcher. The two backends are
# extras so an ONNX-only host never installs torch.
dependencies = [
  "aiohttp>=3.11,<4",
  "eidolon-sdk",
  "huggingface-hub>=0.30,<2",
  "numpy>=2.1,<3",
  "tokenizers>=0.21,<1",
]

[project.optional-dependencies]
# laya 0.3.7 itself is vendored (src/eidolon_models_laya/vendor/laya); these are its runtime deps.
torch = [
  "safetensors>=0.4",
  "torch>=2.6,<3",
  "transformers>=4.48",
]
onnx = [
  "onnxruntime>=1.20,<2",
]
# The training workflow (laya/train): data generation, labelling, training, calibration, eval.
train = [
  "pyyaml>=6,<7",
  "safetensors>=0.4",
  "torch>=2.6,<3",
  "transformers>=4.48",
]
# Only needed to produce models/*/onnx/model.onnx from the PyTorch weights.
export = [
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "onnxscript>=0.2",
  "safetensors>=0.4",
  "torch>=2.6,<3",
  "transformers>=4.48",
]

[project.scripts]
eidolon-laya = "eidolon_models_laya.cli:main"
eidolon-laya-train = "eidolon_laya_train.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-aiohttp>=1.1,<2",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

# On Linux the default PyPI torch wheel is the CUDA build and drags in ~2 GB of
# nvidia-* wheels a CPU server never loads. macOS keeps PyPI's wheel (it has MPS).
[tool.uv.sources]
eidolon-sdk = { path = "../../eidolon_sdk", editable = true }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eidolon_models_laya", "src/eidolon_laya_train"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "model: needs the fetched checkpoint (and, per test, the torch or onnx extra)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# Vendored upstream code is kept byte-for-byte; lint it upstream, not here.
extend-exclude = ["src/eidolon_models_laya/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Ported from laya 0.3.7 as written, %-formatting included, so it diffs cleanly
# against upstream when laya is upgraded.
"src/eidolon_models_laya/sequence.py" = ["UP031"]
# Evaluation scripts assemble Chinese report prose; wrapping those strings only hurts reading.
"evals/**/*.py" = ["E501"]
"train/**/*.py" = ["E501"]
# The workflow's own strings are config keys and Chinese prose; wrapping them only hurts reading.
"src/eidolon_laya_train/**/*.py" = ["E501"]
"tests/test_train_workflow.py" = ["E501"]
"tests/test_external_adapters.py" = ["E501"]
